<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thoughts in the Dirt</title>
<style>
:root{color-scheme:dark;background:#1a0d07;color:#f7d59a;font-family:system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;padding:24px;background:radial-gradient(circle at 50% 20%,#5c2c15,#1a0d07 72%);min-height:100vh}header{max-width:1200px;margin:auto auto 20px}h1{font-weight:500;margin:0}.status{color:#d6a86c}.grid{max-width:1200px;margin:auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}article{background:#2c160c;border:1px solid #6e3a1e;border-radius:14px;overflow:hidden}svg{display:block;width:100%;aspect-ratio:4/3;background:#3a2012}section{padding:14px}h2{font-size:1rem;font-weight:500;margin:0 0 5px}.meta,p{font-size:.875rem;margin:0;color:#d6a86c}.core{fill:none;stroke:#f3bd61;stroke-width:5.5;stroke-linecap:round;stroke-linejoin:round}.soft{fill:none;stroke:#d99038;stroke-width:12;stroke-linecap:round;stroke-linejoin:round;filter:url(#blur)}

#render-window{position:fixed;z-index:10000;top:5vh;right:3vw;width:min(36vw,680px);height:88vh;min-width:360px;min-height:420px;background:#1c100a;border:1px solid #80502d;border-radius:12px;box-shadow:0 22px 70px #000b;display:flex;flex-direction:column;overflow:hidden;resize:both}#render-window.maximized{inset:0;width:100vw;height:100vh;max-width:none;border-radius:0;resize:none}#render-window.minimized{height:48px!important;min-height:48px;resize:none}#render-window.closed{display:none}.window-bar{height:48px;flex:0 0 48px;display:flex;align-items:center;gap:10px;padding:0 10px 0 14px;background:#2b170d;border-bottom:1px solid #704124;user-select:none;cursor:move}.window-title{font-size:.9rem;font-weight:600;letter-spacing:.02em;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.window-actions{display:flex;gap:6px}.window-actions button,.reopen-button{border:1px solid #7b4a2a;background:#3a2114;color:#f7d59a;border-radius:7px;min-width:34px;height:32px;font:inherit;cursor:pointer}.window-actions button:hover,.reopen-button:hover{background:#4a2b19}.window-body{display:flex;flex-direction:column;min-height:0;flex:1}.minimized .window-body{display:none}.render-stage{position:relative;flex:1;min-height:220px;background:#3a2012;overflow:hidden}.render-stage svg{width:100%;height:100%;aspect-ratio:auto}.render-loading{position:absolute;inset:0;display:grid;place-items:center;background:#1a0d0799;color:#f1c47d;font-size:.9rem}.render-loading[hidden]{display:none}.seed-controls{flex:0 0 auto;padding:12px;background:#24140d;border-top:1px solid #6e3a1e}.seed-controls label{display:block;font-size:.78rem;color:#d6a86c;margin-bottom:6px}.seed-row{display:flex;gap:8px}.seed-row textarea{flex:1;min-width:0;resize:vertical;min-height:54px;max-height:130px;border:1px solid #704124;border-radius:8px;background:#130b07;color:#f7d59a;padding:9px 10px;font:16px/1.35 system-ui,sans-serif}.seed-row button{flex:0 0 auto;align-self:stretch;border:1px solid #9b6032;border-radius:8px;background:#5b3219;color:#ffe3ad;padding:0 14px;font-weight:600;cursor:pointer}.seed-row button:disabled{opacity:.55;cursor:wait}.render-meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;color:#c99a63;font-size:.72rem}.render-error{margin-top:7px;color:#ffb3a8;font-size:.78rem;min-height:1em}.reopen-button{position:fixed;z-index:9999;right:18px;bottom:18px;padding:0 12px;display:none}.reopen-button.visible{display:block}@media(max-width:800px){#render-window{top:3vh;right:4vw;width:92vw;height:82vh;min-width:0}.window-title{font-size:.8rem}.seed-row{flex-direction:column}.seed-row button{min-height:42px}}
</style></head><body><header><h1>Thoughts in the Dirt</h1><div class="status" aria-live="polite">Waiting for agent thoughts…</div></header><main class="grid"></main>

<aside id="render-window" role="dialog" aria-label="Image generation test window" aria-modal="false">
  <div class="window-bar" id="window-bar">
    <div class="window-title">Image Generation Test · Text Seed → Neural Shape</div>
    <div class="window-actions">
      <button id="minimize-window" type="button" title="Minimize" aria-label="Minimize">—</button>
      <button id="maximize-window" type="button" title="Full screen" aria-label="Toggle full screen">□</button>
      <button id="close-window" type="button" title="Close" aria-label="Close">×</button>
    </div>
  </div>
  <div class="window-body">
    <div class="render-stage" id="render-stage" aria-live="polite">
      <svg id="seed-render" viewBox="0 0 600 460" role="img" aria-label="Generated synesthetic seed image"><rect width="600" height="460" fill="#3a2012"/></svg>
      <div class="render-loading" id="render-loading">Rendering seed through neural population model…</div>
    </div>
    <form class="seed-controls" id="seed-form">
      <label for="seed-text">Initial seed input</label>
      <div class="seed-row">
        <textarea id="seed-text" maxlength="240" spellcheck="true">The ducks in the park are free, i have forty of them</textarea>
        <button id="render-button" type="submit">Render</button>
      </div>
      <div class="render-meta" id="render-meta"></div>
      <div class="render-error" id="render-error" role="alert"></div>
    </form>
  </div>
</aside>
<button id="reopen-window" class="reopen-button" type="button">Open test renderer</button>

<script>
const grid=document.querySelector('.grid'),status=document.querySelector('.status');
const escapeHtml=value=>String(value).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#39;'}[ch]));
function bounds(paths){return paths.flat().reduce((b,[x,y])=>[Math.min(b[0],x),Math.min(b[1],y),Math.max(b[2],x),Math.max(b[3],y)],[Infinity,Infinity,-Infinity,-Infinity]);}
function pathData(path,b,width=300,height=220,pad=25){const sx=(width-2*pad)/Math.max(1e-9,b[2]-b[0]),sy=(height-2*pad)/Math.max(1e-9,b[3]-b[1]),s=Math.min(sx,sy),ox=width/2-(b[0]+b[2])/2*s,oy=height/2+(b[1]+b[3])/2*s;return path.map(([x,y],i)=>`${i?'L':'M'}${(ox+x*s).toFixed(2)},${(oy-y*s).toFixed(2)}`).join(' ');}
function draw(thought,index){const article=document.createElement('article'),b=bounds(thought.paths),id=`blur-${index}`,paths=thought.paths.map(p=>`<path d="${pathData(p,b)}"/>`).join(''),neural=thought.visualization?.mode==='neural'?thought.visualization.populations.map((p,i)=>`M${i+1} ${Number(p.magnitude).toFixed(3)} @ ${Number(p.angleDegrees).toFixed(1)}°`).join(' · '):'geometric paths';article.innerHTML=`<svg viewBox="0 0 300 220" role="img" aria-label="${escapeHtml(thought.concept)}"><defs><filter id="${id}" x="-25%" y="-25%" width="150%" height="150%"><feTurbulence type="fractalNoise" baseFrequency=".025 .08" numOctaves="2" seed="${index+1}" result="soil"/><feDisplacementMap in="SourceGraphic" in2="soil" scale="3"/><feGaussianBlur stdDeviation="3"/></filter></defs><g class="soft" style="filter:url(#${id})">${paths}</g><g class="core">${paths}</g></svg><section><h2>${escapeHtml(thought.concept)}</h2><div class="meta">${escapeHtml(thought.agentName||thought.agentId)} · thought ${thought.sequence} · ${escapeHtml(neural)}</div>${thought.publicRationale?`<p>${escapeHtml(thought.publicRationale)}</p>`:''}</section>`;grid.appendChild(article);}
async function refresh(){try{const data=await fetch('/v1/gallery').then(r=>r.json());grid.replaceChildren();data.thoughts.forEach(draw);status.textContent=data.thoughts.length?`${data.thoughts.length} thought${data.thoughts.length===1?'':'s'} received`:'Waiting for agent thoughts…';}catch{status.textContent='Gallery temporarily unavailable';}}
refresh();setInterval(refresh,5000);

const renderWindow=document.getElementById('render-window'),windowBar=document.getElementById('window-bar'),minimizeButton=document.getElementById('minimize-window'),maximizeButton=document.getElementById('maximize-window'),closeButton=document.getElementById('close-window'),reopenButton=document.getElementById('reopen-window'),seedForm=document.getElementById('seed-form'),seedText=document.getElementById('seed-text'),renderButton=document.getElementById('render-button'),seedRender=document.getElementById('seed-render'),renderLoading=document.getElementById('render-loading'),renderMeta=document.getElementById('render-meta'),renderError=document.getElementById('render-error');
let minimized=false,maximized=false,drag=null,normalRect=null;

function setMinimized(value){minimized=value;renderWindow.classList.toggle('minimized',value);minimizeButton.textContent=value?'▢':'—';minimizeButton.title=value?'Restore':'Minimize';}
function setMaximized(value){if(value&&!maximized){normalRect=renderWindow.getBoundingClientRect();setMinimized(false);}maximized=value;renderWindow.classList.toggle('maximized',value);maximizeButton.textContent=value?'❐':'□';maximizeButton.title=value?'Restore window':'Full screen';if(!value&&normalRect){renderWindow.style.left=`${normalRect.left}px`;renderWindow.style.top=`${normalRect.top}px`;renderWindow.style.right='auto';renderWindow.style.width=`${normalRect.width}px`;renderWindow.style.height=`${normalRect.height}px`;}}
minimizeButton.addEventListener('click',()=>setMinimized(!minimized));
maximizeButton.addEventListener('click',()=>setMaximized(!maximized));
closeButton.addEventListener('click',()=>{renderWindow.classList.add('closed');reopenButton.classList.add('visible');});
reopenButton.addEventListener('click',()=>{renderWindow.classList.remove('closed');reopenButton.classList.remove('visible');setMinimized(false);});
windowBar.addEventListener('dblclick',event=>{if(event.target.closest('button'))return;setMaximized(!maximized);});

windowBar.addEventListener('pointerdown',event=>{if(maximized||event.target.closest('button'))return;const r=renderWindow.getBoundingClientRect();drag={dx:event.clientX-r.left,dy:event.clientY-r.top};windowBar.setPointerCapture(event.pointerId);});
windowBar.addEventListener('pointermove',event=>{if(!drag||maximized)return;const left=Math.max(0,Math.min(window.innerWidth-renderWindow.offsetWidth,event.clientX-drag.dx)),top=Math.max(0,Math.min(window.innerHeight-48,event.clientY-drag.dy));renderWindow.style.left=`${left}px`;renderWindow.style.top=`${top}px`;renderWindow.style.right='auto';});
windowBar.addEventListener('pointerup',event=>{drag=null;if(windowBar.hasPointerCapture(event.pointerId))windowBar.releasePointerCapture(event.pointerId);});

function renderPaths(data){const paths=Array.isArray(data.paths)?data.paths:[];if(!paths.length)throw new Error('Renderer returned no geometry.');const b=bounds(paths),width=600,height=460,pad=38,d=paths.map(p=>`<path d="${pathData(p,b,width,height,pad)}"/>`).join('');seedRender.innerHTML=`<defs><filter id="seed-soil" x="-25%" y="-25%" width="150%" height="150%"><feTurbulence type="fractalNoise" baseFrequency=".025 .08" numOctaves="2" seed="40" result="soil"/><feDisplacementMap in="SourceGraphic" in2="soil" scale="3"/><feGaussianBlur stdDeviation="3"/></filter></defs><rect width="600" height="460" fill="#3a2012"/><g fill="none" stroke="#d99038" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" filter="url(#seed-soil)">${d}</g><g fill="none" stroke="#f3bd61" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">${d}</g>`;const q=data.perception?.quantity,semantic=data.perception?.populations?.slice?.(0,3)||[],neural=data.neuralPopulations||[];renderMeta.replaceChildren();const items=[`${paths.length} paths`,q?`quantity ${q}`:'no explicit quantity',...semantic.map(p=>`${p.label||p.name||'population'} ${Number(p.activation??p.magnitude??0).toFixed(2)}`),...neural.slice(0,2).map((p,i)=>`M${i+1} ${Number(p.magnitude||0).toFixed(3)}`)];for(const item of items){const span=document.createElement('span');span.textContent=item;renderMeta.appendChild(span);}}

async function renderSeed(text){const seed=text.trim();renderError.textContent='';if(!seed){renderError.textContent='Enter a seed phrase.';return;}renderButton.disabled=true;renderLoading.hidden=false;try{const response=await fetch('/v1/render-text',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({text:seed})});const data=await response.json();if(!response.ok)throw new Error(data.message||data.error||'Render failed');renderPaths(data);}catch(error){renderError.textContent=error.message||'Render failed.';}finally{renderButton.disabled=false;renderLoading.hidden=true;}}
seedForm.addEventListener('submit',event=>{event.preventDefault();renderSeed(seedText.value);});
renderSeed(seedText.value);
</script></body></html>
