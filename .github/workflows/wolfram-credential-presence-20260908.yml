name: Wolfram credential presence probe 20260908

on:
  push:
    branches:
      - research/wolfram-history-20260908T015249Z-9bd256
    paths:
      - .github/workflows/wolfram-credential-presence-20260908.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Report only whether common Wolfram secrets exist
        env:
          WID: ${{ secrets.WOLFRAM_ID }}
          WEMAIL: ${{ secrets.WOLFRAM_EMAIL }}
          WPASS: ${{ secrets.WOLFRAM_PASSWORD }}
          WPASS_ALT: ${{ secrets.WOLFRAM_PASS }}
          WENT: ${{ secrets.WOLFRAM_ENTITLEMENT }}
          WKEY: ${{ secrets.WOLFRAM_ACTIVATION_KEY }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          names = ['WID','WEMAIL','WPASS','WPASS_ALT','WENT','WKEY']
          result = {name: bool(os.environ.get(name)) for name in names}
          result['credential_pair_available'] = (result['WID'] or result['WEMAIL']) and (result['WPASS'] or result['WPASS_ALT'])
          result['entitlement_available'] = result['WENT']
          result['activation_key_available'] = result['WKEY']
          print(json.dumps(result, sort_keys=True))
          PY
