name: Wolfram documented HTTP probe 9bd256
on:
  push:
    branches: ['research/wolfram-history-20260908T015249Z-9bd256']
    paths: ['.github/workflows/wolfram-http-probe-9bd256.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Direct documented endpoint probe without credentials
        shell: bash
        run: |
          mkdir evidence
          cat > evidence/probe.py <<'PY'
          import json, urllib.request, urllib.error, datetime, pathlib, platform
          URL='https://agenttools.wolfram.com/mcp'
          headers={'Content-Type':'application/json','Accept':'application/json, text/event-stream'}
          records=[]
          def request(name,payload):
              rec={'name':name,'at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'request':payload,'url':URL}
              records.append(rec)
              try:
                  req=urllib.request.Request(URL,data=json.dumps(payload).encode(),headers=headers,method='POST')
                  with urllib.request.urlopen(req,timeout=35) as response:
                      rec['http_status']=response.status;rec['content_type']=response.headers.get('Content-Type')
                      sid=response.headers.get('Mcp-Session-Id')
                      if sid: headers['Mcp-Session-Id']=sid
                      if 'text/event-stream' in rec['content_type']:
                          for line in response:
                              if line.startswith(b'data:'):
                                  value=json.loads(line[5:].strip())
                                  if value.get('id')==payload.get('id'):
                                      rec['response']=value;return value
                          return None
                      raw=response.read(2000000).decode();rec['response']=json.loads(raw) if raw else None
                      return rec['response']
              except urllib.error.HTTPError as e:
                  rec['http_status']=e.code;rec['error_body']=e.read(4096).decode(errors='replace');return None
              except Exception as e:
                  rec['error']=str(e);return None
          init=request('initialize',{'jsonrpc':'2.0','id':1,'method':'initialize','params':{'protocolVersion':'2025-03-26','capabilities':{},'clientInfo':{'name':'neural-engine-audit','version':'1.0.0'}}})
          if init and 'result' in init:
              headers['MCP-Protocol-Version']=init['result'].get('protocolVersion','2025-03-26')
              request('initialized',{'jsonrpc':'2.0','method':'notifications/initialized'})
              tools=request('tools/list',{'jsonrpc':'2.0','id':2,'method':'tools/list','params':{}})
              names=[t['name'] for t in (tools or {}).get('result',{}).get('tools',[])]
              if 'WolframLanguageEvaluator' in names:
                  request('kernel-smoke',{'jsonrpc':'2.0','id':3,'method':'tools/call','params':{'name':'WolframLanguageEvaluator','arguments':{'code':'ExportString[<|"version"->$Version,"system"->$SystemID,"arithmetic"->4,"symbolic"->FullSimplify[D[1/(1+Exp[-x]),x]-(1/(1+Exp[-x]))(1-1/(1+Exp[-x]))],"solve"->LinearSolve[{{2,1},{1,3}},{1,2}],"mUnit"->TestReport[{VerificationTest[2+2,4]}]["TestsSucceededCount"]|>,"RawJSON"]','timeConstraint':30}}})
          result={'schema':'neural-engine-direct-http-probe/1','python':platform.python_version(),'transport':'Streamable HTTP POST to documented endpoint','credentials_sent':False,'session_identifiers_excluded':True,'records':records,'qualification':'Only an actual evaluator result establishes kernel access. Initialization or tools/list alone is not scientific validation.'}
          pathlib.Path('evidence/RESULT.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result,indent=2))
          PY
          python evidence/probe.py
          cd evidence && sha256sum * > SHA256SUMS.txt
      - name: Preserve actual result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wolfram-http-9bd256-${{ github.run_id }}
          path: evidence/
          retention-days: 90
